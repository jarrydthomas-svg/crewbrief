<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <meta name="referrer" content="no-referrer">
    <meta name="theme-color" content="#050708">
    <link rel="canonical" href="https://crewbrief.ca/">
    <title>CrewBrief</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        background: #050708;
        overflow: hidden;
      }
      body {
        min-height: 100svh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
      }
      .player {
        position: relative;
        width: min(100vw, calc(100svh * 16 / 9));
        aspect-ratio: 16 / 9;
        background: #000;
        overflow: hidden;
      }
      video {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #000;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      video::-webkit-media-controls { display: none !important; }
      .play {
        position: absolute;
        inset: 0;
        width: 100%;
        border: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 0.8rem;
        color: #fff;
        background: rgb(0 0 0 / 34%);
        font: 700 clamp(1rem, 2.6vw, 1.4rem) / 1 Arial, Helvetica, sans-serif;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      .play[hidden] { display: none; }
      .play:focus-visible,
      video:focus-visible {
        outline: 4px solid #f3b81b;
        outline-offset: -6px;
      }
      .icon {
        width: clamp(4rem, 10vw, 6.5rem);
        aspect-ratio: 1;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: #f3b81b;
        box-shadow: 0 0.8rem 2.4rem rgb(0 0 0 / 45%);
      }
      .icon::before {
        content: "";
        width: 0;
        height: 0;
        margin-left: 0.42rem;
        border-top: 0.85rem solid transparent;
        border-bottom: 0.85rem solid transparent;
        border-left: 1.35rem solid #111;
      }
      @media (orientation: portrait) {
        .player { width: 100vw; }
      }
    </style>
  </head>
  <body>
    <main class="player" aria-label="Safety video">
      <video
        id="video"
        src="clutch-brake-safety.mp4"
        poster="poster.jpg"
        preload="metadata"
        playsinline
        disablepictureinpicture
        controlslist="nodownload noplaybackrate noremoteplayback"
        tabindex="0"
      >
        Your browser does not support video playback.
      </video>
      <button id="play" class="play" type="button" aria-label="Play video">
        <span class="icon" aria-hidden="true"></span>
        <span id="label">Play video</span>
      </button>
    </main>
    <script>
      const video = document.querySelector("#video");
      const button = document.querySelector("#play");
      const label = document.querySelector("#label");

      async function togglePlayback() {
        if (video.paused || video.ended) {
          if (video.ended) video.currentTime = 0;
          await video.play();
        } else {
          video.pause();
        }
      }

      button.addEventListener("click", togglePlayback);
      video.addEventListener("click", togglePlayback);
      video.addEventListener("keydown", (event) => {
        if (event.key === " " || event.key === "Enter") {
          event.preventDefault();
          togglePlayback();
        }
      });
      video.addEventListener("play", () => { button.hidden = true; });
      video.addEventListener("pause", () => {
        if (!video.ended) {
          label.textContent = "Continue";
          button.setAttribute("aria-label", "Continue video");
          button.hidden = false;
        }
      });
      video.addEventListener("ended", () => {
        label.textContent = "Replay";
        button.setAttribute("aria-label", "Replay video");
        button.hidden = false;
      });
    </script>
  </body>
</html>
